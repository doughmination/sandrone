<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240">
  <style>@keyframes aw-drift{50%{transform:translateX(5px)}}.aw-cloud{animation:aw-drift 7s ease-in-out infinite}@keyframes aw-snowfall{0%{transform:translate(0,0);opacity:1}50%{transform:translate(2.5px,8px)}90%{opacity:1}100%{transform:translate(-1px,15px);opacity:0}}.aw-flake{animation:aw-snowfall 3.2s linear infinite}.aw-f2{animation-delay:1.1s}.aw-f3{animation-delay:2.1s}@media (prefers-reduced-motion:reduce){*{animation:none !important}}.aw-ink{fill:#243140}.aw-sub{fill:rgba(36,49,64,0.76)}.aw-faint{fill:rgba(36,49,64,0.24)}.aw-stroke{stroke:rgba(36,49,64,0.24)}.aw-s0{stop-color:#8FA9C9}.aw-s1{stop-color:#D6E4F2}.aw-c0{stop-color:#ffffff}.aw-c1{stop-color:#d7dee8}.aw-bg{fill:transparent}@media (prefers-color-scheme:dark){.aw-ink{fill:#ffffff}.aw-sub{fill:rgba(255,255,255,0.78)}.aw-faint{fill:rgba(255,255,255,0.28)}.aw-stroke{stroke:rgba(255,255,255,0.28)}.aw-s0{stop-color:#1E2B40}.aw-s1{stop-color:#3E5471}.aw-c0{stop-color:#b8c4d4}.aw-c1{stop-color:#8494ac}.aw-bg{fill:transparent}}</style>
  <defs>
    <linearGradient id="aw-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="aw-s0"/>
      <stop offset="1" class="aw-s1"/>
    </linearGradient>
    <linearGradient id="awg-cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="aw-c0"/>
      <stop offset="1" class="aw-c1"/>
    </linearGradient>
    <radialGradient id="awg-sun" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#FFE29A"/>
      <stop offset="1" stop-color="#FFB020"/>
    </radialGradient>
    <linearGradient id="awg-storm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A8699"/>
      <stop offset="1" stop-color="#56637A"/>
    </linearGradient>
    <symbol id="aw-i-snowy" viewBox="0 0 64 64">
      <g class="aw-flake aw-f1" transform="translate(21,50)" stroke="#DDEBFF" stroke-width="1.7" stroke-linecap="round">
        <path d="M-4 0H4M-2 -3.46L2 3.46M-2 3.46L2 -3.46"/>
      </g>
      <g class="aw-flake aw-f2" transform="translate(33,55)" stroke="#DDEBFF" stroke-width="1.7" stroke-linecap="round">
        <path d="M-4 0H4M-2 -3.46L2 3.46M-2 3.46L2 -3.46"/>
      </g>
      <g class="aw-flake aw-f3" transform="translate(44,49)" stroke="#DDEBFF" stroke-width="1.7" stroke-linecap="round">
        <path d="M-4 0H4M-2 -3.46L2 3.46M-2 3.46L2 -3.46"/>
      </g>
      <g class="aw-cloud" transform="translate(1,-6) scale(0.92)" fill="url(#awg-cloud)">
        <circle cx="19" cy="40" r="11"/>
        <circle cx="33" cy="31" r="14"/>
        <circle cx="45" cy="40" r="10"/>
        <rect x="14" y="36" width="42" height="15" rx="7.5"/>
      </g>
    </symbol>
    <clipPath id="aw-card"><rect x="1" y="1" width="478" height="238" rx="16"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="479" height="239" rx="16" fill="url(#aw-sky)" class="aw-stroke"/>
  <g clip-path="url(#aw-card)">
    <g fill="#EAF2FB" opacity="0.85">
      <circle class="aw-flake aw-f1" cx="358.19" cy="28.99" r="1.64"/>
      <circle class="aw-flake aw-f2" cx="194.74" cy="59.17" r="1.58"/>
      <circle class="aw-flake aw-f3" cx="450.96" cy="76.3" r="2.3"/>
      <circle class="aw-flake aw-f1" cx="198.15" cy="81.01" r="2.57"/>
      <circle class="aw-flake aw-f2" cx="379.25" cy="31.58" r="2.09"/>
      <circle class="aw-flake aw-f3" cx="230.73" cy="50.19" r="1.95"/>
      <circle class="aw-flake aw-f1" cx="188.16" cy="74.53" r="1.78"/>
    </g>
  </g>
  <text x="28" y="37" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" class="aw-ink">doughmination/sandrone</text>
  <text x="452" y="34" text-anchor="end" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="12" class="aw-sub">last 7 days</text>
  <text x="452" y="52" text-anchor="end" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="10.5" class="aw-sub" opacity="0.8">2 km/h · 100%</text>
  <use href="#aw-i-snowy" x="30" y="74" width="116" height="116"/>
  <text x="176" y="153" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" class="aw-ink">5°</text>
  <text x="250.1" y="150" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="24" fill="#DDEBFF">↘</text>
  <text x="178" y="178" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" class="aw-sub">SNOWY</text>
  <text x="178" y="200" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" class="aw-sub">Frozen over — the repository is hibern…</text>
  <line x1="28" y1="212" x2="452" y2="212" class="aw-stroke" stroke-width="1"/>
  <text x="28" y="232" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="aw-ink">0<tspan dx="5" font-size="10.5" font-weight="400" class="aw-sub">commits</tspan></text>
  <text x="136" y="232" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="aw-ink">1<tspan dx="5" font-size="10.5" font-weight="400" class="aw-sub">prs</tspan></text>
  <text x="244" y="232" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="aw-ink">0<tspan dx="5" font-size="10.5" font-weight="400" class="aw-sub">issues</tspan></text>
  <text x="352" y="232" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="aw-ink">+0<tspan dx="5" font-size="10.5" font-weight="400" class="aw-sub">stars</tspan></text>
</svg>
