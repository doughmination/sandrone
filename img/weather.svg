<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240">
  <style>@keyframes aw-spin{to{transform:rotate(360deg)}}@keyframes aw-breathe{50%{transform:scale(1.05)}}.aw-rays{animation:aw-spin 90s linear infinite;transform-origin:32px 32px}.aw-sun-core{animation:aw-breathe 4s ease-in-out infinite;transform-origin:32px 32px}@keyframes aw-twinkle{50%{opacity:1}}.aw-star{opacity:.25;animation:aw-twinkle 2.8s ease-in-out infinite}.aw-t2{animation-delay:.9s}.aw-t3{animation-delay:1.7s}@media (prefers-reduced-motion:reduce){*{animation:none !important}}.aw-ink{fill:#ffffff}.aw-sub{fill:rgba(255,255,255,0.78)}.aw-faint{fill:rgba(255,255,255,0.28)}.aw-stroke{stroke:rgba(255,255,255,0.28)}.aw-s0{stop-color:#3D8FD6}.aw-s1{stop-color:#7EC3F0}.aw-c0{stop-color:#ffffff}.aw-c1{stop-color:#d7dee8}.aw-bg{fill:transparent}@media (prefers-color-scheme:dark){.aw-ink{fill:#ffffff}.aw-sub{fill:rgba(255,255,255,0.78)}.aw-faint{fill:rgba(255,255,255,0.28)}.aw-stroke{stroke:rgba(255,255,255,0.28)}.aw-s0{stop-color:#12295C}.aw-s1{stop-color:#3A5FA0}.aw-c0{stop-color:#b8c4d4}.aw-c1{stop-color:#8494ac}.aw-bg{fill:transparent}}</style>
  <defs>
    <linearGradient id="aw-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="aw-s0"/>
      <stop offset="1" class="aw-s1"/>
    </linearGradient>
    <linearGradient id="awg-cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="aw-c0"/>
      <stop offset="1" class="aw-c1"/>
    </linearGradient>
    <radialGradient id="awg-sun" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#FFE29A"/>
      <stop offset="1" stop-color="#FFB020"/>
    </radialGradient>
    <linearGradient id="awg-storm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A8699"/>
      <stop offset="1" stop-color="#56637A"/>
    </linearGradient>
    <symbol id="aw-i-sunny" viewBox="0 0 64 64">
      <g class="aw-rays" stroke="#FFC53D" stroke-width="4.5" stroke-linecap="round">
        <line x1="53" y1="32" x2="61" y2="32"/>
        <line x1="46.85" y1="46.85" x2="52.51" y2="52.51"/>
        <line x1="32" y1="53" x2="32" y2="61"/>
        <line x1="17.15" y1="46.85" x2="11.49" y2="52.51"/>
        <line x1="11" y1="32" x2="3" y2="32"/>
        <line x1="17.15" y1="17.15" x2="11.49" y2="11.49"/>
        <line x1="32" y1="11" x2="32" y2="3"/>
        <line x1="46.85" y1="17.15" x2="52.51" y2="11.49"/>
      </g>
      <circle class="aw-sun-core" cx="32" cy="32" r="15" fill="url(#awg-sun)"/>
    </symbol>
    <clipPath id="aw-card"><rect x="1" y="1" width="478" height="238" rx="16"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="479" height="239" rx="16" fill="url(#aw-sky)" class="aw-stroke"/>
  <g clip-path="url(#aw-card)">
    <g fill="#F4FAFF">
      <circle class="aw-star aw-t1" cx="361.7" cy="24.94" r="1.2" opacity="0.6"/>
      <circle class="aw-star aw-t2" cx="203.88" cy="53.53" r="1.15" opacity="0.6"/>
      <circle class="aw-star aw-t3" cx="451.27" cy="69.76" r="1.75" opacity="0.6"/>
      <circle class="aw-star aw-t1" cx="207.18" cy="74.22" r="1.97" opacity="0.6"/>
    </g>
  </g>
  <text x="28" y="37" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" class="aw-ink">doughmination/sandrone</text>
  <text x="452" y="34" text-anchor="end" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="12" class="aw-sub">last 7 days</text>
  <text x="452" y="52" text-anchor="end" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="10.5" class="aw-sub" opacity="0.8">8 km/h · 50%</text>
  <use href="#aw-i-sunny" x="30" y="74" width="116" height="116"/>
  <text x="176" y="153" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" class="aw-ink">36°</text>
  <text x="282.5" y="150" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="24" fill="#FFB020">↗</text>
  <text x="178" y="178" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" class="aw-sub">SUNNY</text>
  <text x="178" y="200" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" class="aw-sub">Clear skies — commits are pouring in</text>
  <line x1="28" y1="212" x2="452" y2="212" class="aw-stroke" stroke-width="1"/>
  <text x="28" y="232" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="aw-ink">45<tspan dx="5" font-size="10.5" font-weight="400" class="aw-sub">commits</tspan></text>
  <text x="136" y="232" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="aw-ink">2<tspan dx="5" font-size="10.5" font-weight="400" class="aw-sub">prs</tspan></text>
  <text x="244" y="232" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="aw-ink">0<tspan dx="5" font-size="10.5" font-weight="400" class="aw-sub">issues</tspan></text>
  <text x="352" y="232" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="aw-ink">+0<tspan dx="5" font-size="10.5" font-weight="400" class="aw-sub">stars</tspan></text>
</svg>
