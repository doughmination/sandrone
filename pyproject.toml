[project]
name = "sandrone"
version = "1.5.0"
description = "Python utility bot"
readme = "README.md"
authors = [
    { name = "Clove Twilight", email = "admin@doughmination.win" }
]
requires-python = ">=3.14"
dependencies = [
    "argostranslate>=1.11.0",
    "colorful>=0.5.8",
    "discord-py>=2.7.1",
    "imageio-ffmpeg>=0.6.0",
    "pillow>=11.0.0",
    "pluralkit>=1.2.1",
    "pygithub>=2.9.1",
    "python-dotenvx>=2.0.0",
    "qrcode[pil]>=8.2",
    "ruff>=0.16.3",
    "toml>=0.10.2",
    "ty>=0.0.72",
    "watchfiles>=1.2.0",
    "wikipedia-api>=0.15.0",
    "yt-dlp>=2026.8.19",
]

[tool.uv]
package=false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
